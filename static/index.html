<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Read Recovery Version Bible cross-references in English and Chinese.">
<title>Recovery Verse Finder · 恢复本经文查询</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
<header>
<div class="edition">HOLY BIBLE <span>·</span> RECOVERY VERSION</div>
<h1>Recovery Verse Finder</h1>
<p lang="zh-Hans">恢复本经文查询</p>
</header>
<section aria-label="Verse lookup">
<form id="lookup">
<label for="refs">Passage references <span lang="zh-Hans">经文出处</span></label>
<div class="input-row">
<input id="refs" placeholder="利十九2；来二11、十10 or John 1:16–17" autocomplete="off" required maxlength="1500">
<button type="submit">Look up <span lang="zh-Hans">查询</span></button>
</div>
</form>
<div id="topics" aria-label="Saved topics">
<button id="all-topics" type="button" aria-pressed="false">全部主题 · All topics</button>
</div>
<div class="result-actions">
<p id="status" role="status"></p>
<button id="download" type="button" disabled>Download TXT · 下载文本</button>
</div>
</section>
<section id="results" aria-label="中英对照经文 · Bilingual verses" aria-busy="false"></section>
<footer>
<a href="https://recoveryversion8.twgbr.org/">中文恢复本 · 台湾福音书房</a>
<a href="https://text.recoveryversion.bible/">English Recovery Version · Living Stream Ministry</a>
</footer>
</main>
</body>
</html>
